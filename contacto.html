<section class="page-section">
  <div class="section-header page-hero">
    <span class="section-num">04</span>
    <h2 class="section-title">Contacto</h2>
    <div class="section-line"></div>
  </div>

  <!--
    FORMULARIO FUNCIONAL CON FORMSPREE
    1. Creá una cuenta gratis en https://formspree.io (con tu mail)
    2. Creá un nuevo "Form", te va a dar una URL tipo:
       https://formspree.io/f/xxxxxxx
    3. Reemplazá "TU_ID_DE_FORMSPREE" en el action de abajo por ese ID.
    4. Formspree te manda un mail de confirmación la primera vez
       que alguien envía el formulario — confirmalo una sola vez.
    Más detalle en el README.md del proyecto.
  -->
  <form id="contact-form" class="contact-form reveal" action="https://formspree.io/f/xyezejpk" method="POST">
    <div class="form-group">
      <label for="name">Nombre</label>
      <input type="text" id="name" name="name" required placeholder="Tu nombre">
    </div>
    <div class="form-group">
      <label for="email">Email</label>
      <input type="email" id="email" name="email" required placeholder="tu@email.com">
    </div>
    <div class="form-group">
      <label for="subject">Asunto</label>
      <input type="text" id="subject" name="subject" placeholder="¿De qué se trata?">
    </div>
    <div class="form-group">
      <label for="message">Mensaje</label>
      <textarea id="message" name="message" required placeholder="Contame en qué te puedo ayudar..."></textarea>
    </div>

    <!-- Honeypot anti-spam: campo invisible, si un bot lo completa se descarta -->
    <input type="text" name="_gotcha" class="form-honeypot" tabindex="-1" autocomplete="off">

    <button type="submit" class="btn btn-primary" id="submit-btn">Enviar mensaje</button>

    <div id="form-status" class="form-status"></div>
  </form>

  <div class="contact-wrapper reveal">
    <a href="https://linkedin.com/in/mate0-amaya" target="_blank" class="contact-link">
      <span class="icon">💼</span>
      <span>linkedin.com/in/mate0-amaya</span>
    </a>
    <a href="https://github.com/M4t30A" target="_blank" class="contact-link">
      <span class="icon">⌨️</span>
      <span>github.com/M4t30A</span>
    </a>
  </div>
</section>

<div id="sudo-overlay">
  <div id="sudo-terminal">
    <div class="sudo-bar"><span>root@m4t30a:~#</span></div>
    <div id="sudo-body"></div>
  </div>
  <button id="sudo-close" onclick="closeSudo()">[ ESC ] CERRAR</button>
</div>

<script src="js/main.js"></script>
<script>
const form = document.getElementById('contact-form');
const status = document.getElementById('form-status');
const submitBtn = document.getElementById('submit-btn');

form.addEventListener('submit', async function (e) {
  e.preventDefault();
  submitBtn.disabled = true;
  submitBtn.textContent = 'Enviando...';

  try {
    const response = await fetch(form.action, {
      method: 'POST',
      body: new FormData(form),
      headers: { 'Accept': 'application/json' }
    });

    if (response.ok) {
      status.textContent = '✓ Mensaje enviado. Te voy a responder a la brevedad.';
      status.className = 'form-status show success';
      form.reset();
    } else {
      const data = await response.json().catch(() => null);
      if (data && data.errors) {
        status.textContent = '✕ ' + data.errors.map(err => err.message).join(', ');
      } else {
        status.textContent = '✕ No se pudo enviar. Probá de nuevo en un momento.';
      }
      status.className = 'form-status show error';
    }
  } catch (err) {
    status.textContent = '✕ Error de conexión. Revisá tu internet e intentá de nuevo.';
    status.className = 'form-status show error';
  } finally {
    submitBtn.disabled = false;
    submitBtn.textContent = 'Enviar mensaje';
  }
});
</script>
</body>
